# Russian is the source of truth: the product was written in Russian first, so
# app_ru.arb is the template every other locale is generated against.
arb-dir: lib/l10n
template-arb-file: app_ru.arb
output-localization-file: app_localizations.dart
output-dir: lib/l10n
output-class: AppLocalizations
nullable-getter: false
